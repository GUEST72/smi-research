name: Rebuild paper index

on:
  push:
    branches: [main]
    paths:
      - "evidence/**.md"
      - "scripts/build_index.py"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate papers.csv
        run: python3 scripts/build_index.py --root .

      - name: Commit if changed
        run: |
          git config user.name "research-index-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- papers.csv; then
            git add papers.csv
            git commit -m "chore: regenerate papers.csv from evidence cards [skip ci]"
            git push
          else
            echo "papers.csv already up to date"
          fi
